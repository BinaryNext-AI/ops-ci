name: Autopilot

on:
  schedule:
    - cron: "0 5,13,21 * * *"
  workflow_dispatch: {}

env:
  PYTHONUNBUFFERED: "1"

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out private repo
        uses: actions/checkout@v4
        with:
          repository: BinaryNext-AI/leadgen-outreach-tool
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Playwright Chromium (+ OS deps)
        run: python -m playwright install --with-deps chromium

      - name: Find new leads
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          SCRAPER_PROXY_URL: ${{ secrets.SCRAPER_PROXY_URL }}
        run: python -m app.cli autopilot --no-send
