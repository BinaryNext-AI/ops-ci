name: Owner Leads Email

# Scheduled copy: BinaryNext-AI/leadgen-outreach-tool's own
# owner-leads-email.yml stays workflow_dispatch only (per its own comment,
# never add a schedule there -- a run would fire twice). This checks out
# that private repo and runs the identical command on a daily cron,
# mirroring owner-leads-sync.yml's own cross-repo pattern exactly.
#
# 17:00 UTC: the same time RevenueOS's own send-emails.yml fires (one of
# its three daily times, 14/17/20 UTC) -- already proven to land inside
# the configured 13:00-22:00 local send window. Once/day here, not three
# times like RevenueOS -- this pipeline is newer and just went live; the
# CLI's own --limit default (20) caps each run, so this is a deliberately
# slower ramp, not a technical limit.
#
# Still gated by owner_leads_sending_enabled (a SEPARATE DB-backed switch
# from RevenueOS's own `sending_enabled`) and the send window -- this
# schedule firing does not bypass either.

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch: {}

env:
  PYTHONUNBUFFERED: "1"

jobs:
  owner-leads-email:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out private repo
        uses: actions/checkout@v4
        with:
          repository: BinaryNext-AI/leadgen-outreach-tool
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Email owner-led leads
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m app.cli owner-leads email --live
