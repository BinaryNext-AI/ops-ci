name: Carrier Leads FMCSA Import

# A one-off top-up of new carriers from FMCSA's register (2-8 trucks, registered
# 30 days to 24 months ago, each checked against FMCSA). The scrape chain
# (carrier-leads-sync.yml) also adds 100 a run; this is for doing it now.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Add at most this many new carriers"
        default: "300"

concurrency:
  group: carrier-leads-fmcsa-import-ops-ci
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  fmcsa-import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out private repo
        uses: actions/checkout@v4
        with:
          repository: BinaryNext-AI/leadgen-outreach-tool
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Add new carriers from FMCSA
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIMIT: ${{ github.event.inputs.limit }}
          # FMCSA throttles requests without one; add it under Settings -> Secrets.
          FMCSA_APP_TOKEN: ${{ secrets.FMCSA_APP_TOKEN }}
        run: python -m app.carrier_fmcsa_import --limit "${LIMIT:-300}"
