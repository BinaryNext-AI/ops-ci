name: Carrier Leads Sync

# Scrapes freight carriers from CarrierSource into the CarrierLead table.
# SELF-RESTARTING (2026-10-13). GitHub starts scheduled runs hours late or
# not at all, so the schedule alone gave ~2 scrapes a day. Each run now
# scrapes (~55 min), RESTS 3 hours (back-to-back runs risk getting the
# CarrierSource account flagged), then starts the next one -- ~6 scrapes a
# day: run number n (the `n` input) is 6-15 trucks when n % 3 == 2, else 1-5
# trucks (the boss's target is 50-100 new Founder-call carriers a day). The
# one daily cron is only a backstop that restarts the chain if it ever
# breaks; if it fires while the chain is alive, the concurrency group keeps
# just ONE waiting run, so the chain never multiplies. Each run resumes
# every fleet-size slice from its saved ScrapeCursor (main repo), and
# app.carrier_pipeline's Postgres advisory lock stops it overlapping a
# dashboard-button run in the private repo.
#
# CarrierSource credentials are NOT passed here -- they live in the
# DB-backed settings table (app/settings_store.py), which get_settings()
# layers on top of env vars, so DATABASE_URL is all this needs.

on:
  schedule:
    - cron: "0 2,6,10,14,18,22 * * *"
  # Pushing .github/chain-start starts the chain at once (GitHub's cron starts
  # are hours late). Touch that file to kick it off by hand; the concurrency
  # group keeps this to one run at a time.
  push:
    paths:
      - ".github/chain-start"
  workflow_dispatch:
    inputs:
      n:
        description: "Run number in the chain (n % 3 == 2 scrapes 6-15 trucks, otherwise 1-5)"
        required: false
        default: "0"

# Lets the job start its own next run (last step below).
permissions:
  contents: read
  actions: write

concurrency:
  group: carrier-leads-sync-ops-ci
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  carrier-leads-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # ~55 min scrape + 3 h rest
    steps:
      - name: Check out private repo
        uses: actions/checkout@v4
        with:
          repository: BinaryNext-AI/leadgen-outreach-tool
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Sync carrier leads
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          N: ${{ github.event.inputs.n }}
        run: |
          # Every third run covers 6-15 trucks; the rest are the Founder-call size (1-5).
          if [ $(( ${N:-0} % 3 )) -eq 2 ]; then fleet=(--fleet-min 6 --fleet-max 15); else fleet=(--fleet-min 1 --fleet-max 5); fi
          python -m app.cli carrier-leads run --total-pages 50 --batch-size 3 --limit 1000 "${fleet[@]}" --newest --max-authority-age-days 548

      # Rest, then start the next run. always(): a failed scrape must not break
      # the chain -- the 3-hour rest means a run that fails instantly can't spin.
      - name: Rest, then start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.inputs.n }}
        run: |
          sleep 10800
          gh workflow run carrier-leads-sync.yml --repo "${{ github.repository }}" --ref main -f n=$(( ${N:-0} + 1 ))
