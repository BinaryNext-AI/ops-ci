name: Carrier Leads Sync

# Scrapes freight carriers from CarrierSource into the CarrierLead table.
# FOUR runs a day (the boss's target, 2026-10-12: 50-100 new Founder-call
# carriers a day -- 1-5 power units):
#   02:00 UTC  6-15 trucks (tiers 2-3)
#   08:00, 14:00, 20:00 UTC  1-5 trucks (Founder calls)
# GitHub starts crons hours late (observed ~6h for the old 02:00), so these
# are spread 6h apart; if two still collide, the concurrency group below
# queues the second, and app.carrier_pipeline's Postgres advisory lock
# makes a run that overlaps a dashboard-button run (private repo) skip.
# Each run resumes every fleet-size slice from its saved ScrapeCursor, so
# repeated runs keep reaching new pages instead of re-walking old ones.
#
# Collects the NEWEST carriers (MC authority at most 18 months old, 1-15
# power units in tiers 1-5, 6-11, 12-15 -- the boss's ICP as revised 2026-10-07):
# CarrierSource has no "newer than" filter, so --newest jumps to where dated
# carriers end in an oldest-first list and walks back from there. See
# app/sources/carrier/_engine.py scrape_newest_companies in the main repo.
#
# CarrierSource credentials are NOT passed here -- they live in the
# DB-backed settings table (app/settings_store.py), which get_settings()
# layers on top of env vars, so DATABASE_URL is all this needs.

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 8,14,20 * * *"
  workflow_dispatch: {}

concurrency:
  group: carrier-leads-sync-ops-ci
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  carrier-leads-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out private repo
        uses: actions/checkout@v4
        with:
          repository: BinaryNext-AI/leadgen-outreach-tool
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Sync carrier leads
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # 02:00 = 6-15 trucks; the other slots (and a manual run) = 1-5.
          if [ "$SCHEDULE" = "0 2 * * *" ]; then fleet=(--fleet-min 6 --fleet-max 15); else fleet=(--fleet-min 1 --fleet-max 5); fi
          python -m app.cli carrier-leads run --total-pages 50 --batch-size 3 --limit 1000 "${fleet[@]}" --newest --max-authority-age-days 548
