name: Replies Sync

on:
  schedule:
    - cron: "30 8,14,20 * * *"
  workflow_dispatch: {}

env:
  PYTHONUNBUFFERED: "1"

jobs:
  replies-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out private repo
        uses: actions/checkout@v4
        with:
          repository: BinaryNext-AI/leadgen-outreach-tool
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Sync replies
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          SCRAPER_PROXY_URL: ${{ secrets.SCRAPER_PROXY_URL }}
        run: python -m app.cli replies sync

      - name: Sweep meetings (briefs + no-show follow-up)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m app.cli meetings sweep
