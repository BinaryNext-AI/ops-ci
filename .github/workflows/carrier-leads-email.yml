name: Carrier Leads Email

# Sends the next due step of Trucklytics' 5-email sequence to CarrierLead
# businesses, from Trucklytics' own trucklytics.net mailboxes.
#
# HOURLY at :07 from 13:07 to 21:07 UTC -- the whole configured send window
# (13:00-22:00 UTC, the DB-backed SEND_WINDOW_START_HOUR/END_HOUR; the gate
# in app.outreach.scheduling.is_within_send_window reads the runner's UTC
# clock). Was once a day at 13:07, but (a) GitHub started it 4-6 hours late
# every day (17:46-19:18 UTC observed 2026-10-07..11) and a start after
# 22:00 sends nothing, and (b) with 20-90s of spacing per send one run can
# only send ~55, far below the 12 mailboxes' 480/day. Each run stops itself
# at --time-budget-minutes 45, before the job timeout, and the next hour's
# run continues; once every mailbox is at its daily cap, later runs send 0.
# Runs never overlap: the concurrency group below within ops-ci, and the
# Postgres advisory lock in app.carrier_outreach across repos (a manual
# dashboard-button run in the private repo makes these skip, and vice versa).
#
# --live is passed deliberately; whether anything actually sends is still
# gated by the DB-backed carrier_leads_sending_enabled switch, its own
# separate kill switch from the other two pipelines'. Mailbox credentials
# come from the DB-backed settings table, so DATABASE_URL is all this
# needs.

on:
  schedule:
    - cron: "7 11-21 * * *"
  workflow_dispatch: {}

# Same guard as the private repo's own copy of this job (added after two
# dispatches overlapped on 2026-10-06). GitHub concurrency groups are
# scoped PER REPO, so this stops ops-ci's own schedule+manual-dispatch
# from double-firing within ops-ci -- it does NOT stop ops-ci and the
# private repo's workflow_dispatch from running at the same time, which is
# why app.carrier_outreach also takes a cross-process Postgres advisory
# lock before sending (see run_carrier_campaign).
concurrency:
  group: carrier-leads-email-ops-ci
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  carrier-leads-email:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out private repo
        uses: actions/checkout@v4
        with:
          repository: BinaryNext-AI/leadgen-outreach-tool
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Email carrier leads
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # --limit 1000: the real daily throttle is the combined mailbox
        # warmup cap, not this flag. Found live 2026-10-12: the CLI's old
        # default of 50 meant this run sent barely a quarter of the day's
        # real capacity (204/day across 12 mailboxes, 216 carriers due).
        run: python -m app.cli carrier-leads email --live --limit 1000 --time-budget-minutes 45
